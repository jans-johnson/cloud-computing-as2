<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-layout">
    <div class="auth-panel">

      <h1 class="auth-heading">Sign <span class="auth-accent">in.</span></h1>

      <div class="backend-bar">
        <span class="backend-label">Backend</span>
        <div class="backend-pills" id="backend-pills">
          <button class="pill" data-backend="lambda">Lambda</button>
          <button class="pill" data-backend="ecs">ECS</button>
          <button class="pill" data-backend="ec2">EC2</button>
        </div>
        <span class="backend-url" id="backend-url"></span>
      </div>

      <div id="error" class="error auth-error"></div>

      <form id="login-form" novalidate class="auth-form">

        <div class="auth-field">
          <label for="email" class="auth-label">Email</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 placeholder="you@studio.fm" required class="auth-input" />
        </div>

        <div class="auth-field">
          <label for="password" class="auth-label">Password</label>
          <div class="auth-input-wrap">
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required class="auth-input" />
            <button type="button" class="auth-eye" id="toggle-pw" aria-label="Toggle password visibility">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-submit">Sign in &rarr;</button>
      </form>

      <p class="auth-switch">New here? <a href="register.html" class="auth-link">Create account</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script>
    // Backend selector — pick which backend to authenticate against.
    // Wired to the verified window.APP_CONFIG (config.js); setActiveBackend
    // persists the choice and reloads so login.js targets the chosen API.
    (function () {
      const cfg = window.APP_CONFIG;
      const pills = document.getElementById("backend-pills");
      const urlEl = document.getElementById("backend-url");

      function refresh() {
        const active = cfg.getActiveBackend();
        pills.querySelectorAll(".pill").forEach(function (btn) {
          const key = btn.dataset.backend;
          btn.classList.toggle("pill-active", key === active);
          btn.disabled = !cfg.isConfigured(key);
          if (!cfg.isConfigured(key)) {
            btn.title = "URL not configured in js/config.js";
          }
        });
        urlEl.textContent = cfg.BACKENDS[active] || "";
      }

      pills.addEventListener("click", function (e) {
        const btn = e.target.closest(".pill");
        if (!btn || btn.disabled) return;
        cfg.setActiveBackend(btn.dataset.backend);
      });

      refresh();
    })();
  </script>
  <script type="module" src="js/login.js"></script>
  <script>
    document.getElementById("toggle-pw").addEventListener("click", function () {
      var pw = document.getElementById("password");
      pw.type = pw.type === "password" ? "text" : "password";
    });
  </script>
</body>
</html>
