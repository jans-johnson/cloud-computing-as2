<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Subscription — Register</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="center">
    <section class="card">
      <h1>Create account</h1>
      <p class="subtitle">It only takes a moment</p>

      <div id="error" class="error"></div>

      <form id="register-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="user_name">Username</label>
        <input id="user_name" name="user_name" type="text" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required />

        <button type="submit" class="btn-block">Register</button>
      </form>

      <p style="margin-top:1rem;font-size:0.9rem;">
        Already have an account? <a class="link" href="index.html">Login</a>
      </p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/register.js"></script>
</body>
</html>
